<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning de Repas Semainier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Style spécifique pour la couleur jaune des DÎNERS */
        .meal-diner {
            background-color: #fef08a !important; /* Yellow 200 */
            border-left: 5px solid #eab308 !important; /* Yellow 500 */
            color: #713f12 !important; /* Yellow 900 */
        }
        .meal-diner-badge {
            background-color: #fde047;
            color: #854d0e;
        }
        
        .meal-ptit-dej {
            background-color: #e0f2fe;
            border-left: 5px solid #0284c7;
            color: #075985;
        }
        .meal-dejeuner {
            background-color: #dcfce7;
            border-left: 5px solid #16a34a;
            color: #14532d;
        }
        .meal-collation {
            background-color: #f3e8ff;
            border-left: 5px solid #9333ea;
            color: #581c87;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .shadow-xl, .shadow-md { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-slate-900 font-bold text-xl shadow-md">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">Mon Planning Repas</h1>
                    <p class="text-xs text-slate-500">Menu de la semaine & liste de courses</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="px-3.5 py-2 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">Imprimer</span>
                </button>
                <button onclick="resetMenu()" class="px-3.5 py-2 text-sm font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Réinitialiser</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <!-- Banner Legend -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4 no-print">
            <div class="flex items-center gap-2 text-sm font-medium text-slate-700">
                <i class="fa-solid fa-palette text-slate-400 mr-1"></i> Légende des couleurs :
            </div>
            <div class="flex flex-wrap items-center gap-3 text-xs font-semibold">
                <span class="px-3 py-1.5 rounded-lg bg-sky-100 border-l-4 border-sky-600 text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-sun"></i> Petit-déjeuner
                </span>
                <span class="px-3 py-1.5 rounded-lg bg-emerald-100 border-l-4 border-emerald-600 text-emerald-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-sun"></i> Déjeuner
                </span>
                <!-- Yellow highlight for Dinner -->
                <span class="px-3 py-1.5 rounded-lg bg-yellow-200 border-l-4 border-yellow-500 text-yellow-900 flex items-center gap-1.5 shadow-sm ring-2 ring-yellow-400/50">
                    <i class="fa-solid fa-moon text-amber-600"></i> Dîner (Jaune)
                </span>
                <span class="px-3 py-1.5 rounded-lg bg-purple-100 border-l-4 border-purple-600 text-purple-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-apple-whole"></i> Collation
                </span>
            </div>
        </div>

        <!-- Filter / Add Quick Button -->
        <div class="flex items-center justify-between mb-4 no-print">
            <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-regular fa-calendar-days text-amber-500"></i> Planning de la Semaine
            </h2>
            <button onclick="openModal()" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold rounded-xl text-sm transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Ajouter un repas
            </button>
        </div>

        <!-- Weekly Grid -->
        <div id="weeklyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4">
            <!-- Grid generated dynamically -->
        </div>

        <!-- Grocery List Section -->
        <section class="mt-10 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm no-print">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 text-lg">Aide-Mémoire Courses</h3>
                        <p class="text-xs text-slate-500">Inspiré de votre menu de la semaine</p>
                    </div>
                </div>
                <button onclick="addGroceryItem()" class="text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg transition">
                    + Ajouter un article
                </button>
            </div>

            <div id="groceryList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                <!-- Grocery items -->
            </div>
        </section>
    </main>

    <!-- Modal Form pour Ajouter / Modifier un Repas -->
    <div id="mealModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-slate-900" id="modalTitle">Ajouter un repas</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="mealForm" onsubmit="saveMeal(event)" class="space-y-4">
                <input type="hidden" id="mealId">

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Jour</label>
                    <select id="mealDay" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="Lundi">Lundi</option>
                        <option value="Mardi">Mardi</option>
                        <option value="Mercredi">Mercredi</option>
                        <option value="Jeudi">Jeudi</option>
                        <option value="Vendredi">Vendredi</option>
                        <option value="Samedi">Samedi</option>
                        <option value="Dimanche">Dimanche</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Type de Repas</label>
                    <select id="mealType" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="Petit-déjeuner">Petit-déjeuner</option>
                        <option value="Déjeuner">Déjeuner</option>
                        <option value="Dîner" selected>Dîner (Couleur Jaune)</option>
                        <option value="Collation">Collation</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nom du Plat</label>
                    <input type="text" id="mealName" required placeholder="ex: Soupe de potiron & tartine de chèvre" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Ingrédients / Notes (Optionnel)</label>
                    <textarea id="mealNotes" rows="2" placeholder="ex: Potiron, crème, pain de campagne" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        Annuler
                    </button>
                    <button type="submit" class="px-5 py-2 text-sm font-bold bg-amber-400 hover:bg-amber-500 text-slate-900 rounded-xl transition shadow">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

        // Initial default data with explicit Yellow Dinners
        const defaultMeals = [
            { id: 1, day: 'Lundi', type: 'Petit-déjeuner', name: 'Muesli, yaourt & fruits rouges', notes: 'Muesli, yaourt grec, myrtilles' },
            { id: 2, day: 'Lundi', type: 'Déjeuner', name: 'Salade César au poulet grillé', notes: 'Poulet, salade romaine, parmesan' },
            { id: 3, day: 'Lundi', type: 'Dîner', name: 'Tartiflette légère & salade verte', notes: 'Pommes de terre, reblochon, salade' },

            { id: 4, day: 'Mardi', type: 'Petit-déjeuner', name: 'Pancakes à l\'avoine & sirop d\'érable', notes: 'Flocons d\'avoine, œufs, banane' },
            { id: 5, day: 'Mardi', type: 'Déjeuner', name: 'Bowl saumon, quinoa & avocat', notes: 'Saumon frais, quinoa, avocat, edamame' },
            { id: 6, day: 'Mardi', type: 'Dîner', name: 'Risotto aux champignons sauvage', notes: 'Riz arborio, champignons, parmesan' },

            { id: 7, day: 'Mercredi', type: 'Déjeuner', name: 'Omelette fines herbes & frites maison', notes: 'Œufs, ciboulette, pommes de terre' },
            { id: 8, day: 'Mercredi', type: 'Dîner', name: 'Curry jaune de légumes & riz basmati', notes: 'Lait de coco, curry, poivrons, pois chiches' },

            { id: 9, day: 'Jeudi', type: 'Petit-déjeuner', name: 'Tartines d\'avocat & œuf poché', notes: 'Pain complet, avocat, œufs' },
            { id: 10, day: 'Jeudi', type: 'Déjeuner', name: 'Wrap au thon, crudités & fromage frais', notes: 'Tortillas, thon, tomates, maïs' },
            { id: 11, day: 'Jeudi', type: 'Dîner', name: 'Lasagnes à la bolognaise fait maison', notes: 'Pâtes lasagnes, viande hachée, sauce tomate' },

            { id: 12, day: 'Vendredi', type: 'Déjeuner', name: 'Pavé de cabillaud & purée de patate douce', notes: 'Cabillaud, patates douces, citron' },
            { id: 13, day: 'Vendredi', type: 'Dîner', name: 'Pizza artisanale 4 fromages', notes: 'Pâte à pizza, mozzarella, gorgonzola' },

            { id: 14, day: 'Samedi', type: 'Petit-déjeuner', name: 'Brunch gourmand viennoiseries & œufs brouillés', notes: 'Croissants, œufs, jus d\'orange' },
            { id: 15, day: 'Samedi', type: 'Dîner', name: 'Burgers maison au cheddar & wedges', notes: 'Pains burger, steak, cheddar, frites' },

            { id: 16, day: 'Dimanche', type: 'Déjeuner', name: 'Poulet rôti du dimanche & légumes au four', notes: 'Poulet entier, carottes, herbes de Provence' },
            { id: 17, day: 'Dimanche', type: 'Dîner', name: 'Velouté de potimarron & croque-monsieur', notes: 'Potimarron, crème, pain de mie, jambon' }
        ];

        let meals = JSON.parse(localStorage.getItem('weekly_meals')) || defaultMeals;
        let groceries = JSON.parse(localStorage.getItem('grocery_items')) || [
            { text: 'Lait de coco & curry jaune', checked: false },
            { text: 'Reblochon pour tartiflette', checked: true },
            { text: 'Champignons frais', checked: false },
            { text: 'Potimarron', checked: false }
        ];

        function saveToStorage() {
            localStorage.setItem('weekly_meals', JSON.stringify(meals));
            localStorage.setItem('grocery_items', JSON.stringify(groceries));
        }

        function getMealClass(type) {
            switch(type) {
                case 'Petit-déjeuner': return 'meal-ptit-dej';
                case 'Déjeuner': return 'meal-dejeuner';
                case 'Dîner': return 'meal-diner'; // Specially requested Yellow
                case 'Collation': return 'meal-collation';
                default: return 'bg-slate-100 text-slate-800';
            }
        }

        function getMealIcon(type) {
            switch(type) {
                case 'Petit-déjeuner': return 'fa-sun text-sky-600';
                case 'Déjeuner': return 'fa-cloud-sun text-emerald-600';
                case 'Dîner': return 'fa-moon text-amber-600';
                case 'Collation': return 'fa-cookie text-purple-600';
                default: return 'fa-utensils';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('weeklyGrid');
            grid.innerHTML = '';

            days.forEach(day => {
                const dayMeals = meals.filter(m => m.day === day);
                
                const col = document.createElement('div');
                col.className = 'bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col shadow-sm';
                
                let dayHeader = `
                    <div class="bg-slate-800 text-white px-3 py-2.5 font-bold text-center text-sm flex items-center justify-between">
                        <span>${day}</span>
                        <button onclick="openModal('${day}')" class="w-6 h-6 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs flex items-center justify-center text-amber-300 transition" title="Ajouter au ${day}">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                `;

                let mealsContent = `<div class="p-2 space-y-2 flex-grow min-h-[220px]">`;

                if (dayMeals.length === 0) {
                    mealsContent += `
                        <div class="h-full flex items-center justify-center text-slate-300 text-xs font-medium py-8 italic text-center">
                            Aucun repas
                        </div>
                    `;
                } else {
                    // Sort order: Petit-déjeuner -> Déjeuner -> Collation -> Dîner
                    const order = {'Petit-déjeuner': 1, 'Déjeuner': 2, 'Collation': 3, 'Dîner': 4};
                    dayMeals.sort((a,b) => (order[a.type] || 99) - (order[b.type] || 99));

                    dayMeals.forEach(meal => {
                        const styleClass = getMealClass(meal.type);
                        const iconClass = getMealIcon(meal.type);
                        const isDiner = meal.type === 'Dîner';

                        mealsContent += `
                            <div class="p-2.5 rounded-xl text-xs ${styleClass} transition relative group">
                                <div class="flex items-center justify-between gap-1 mb-1">
                                    <span class="font-bold uppercase text-[10px] tracking-wider flex items-center gap-1">
                                        <i class="fa-solid ${iconClass}"></i> ${meal.type}
                                    </span>
                                    <div class="opacity-0 group-hover:opacity-100 transition flex items-center gap-1 no-print">
                                        <button onclick="editMeal(${meal.id})" class="hover:text-slate-900"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button onclick="deleteMeal(${meal.id})" class="hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                                <div class="font-semibold ${isDiner ? 'text-amber-950 font-bold' : ''}">${meal.name}</div>
                                ${meal.notes ? `<div class="mt-1 opacity-80 text-[11px] leading-tight line-clamp-2">${meal.notes}</div>` : ''}
                            </div>
                        `;
                    });
                }

                mealsContent += `</div>`;
                col.innerHTML = dayHeader + mealsContent;
                grid.appendChild(col);
            });

            renderGroceries();
        }

        function renderGroceries() {
            const container = document.getElementById('groceryList');
            container.innerHTML = '';

            groceries.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = `flex items-center justify-between p-2.5 rounded-xl border text-xs font-medium transition ${item.checked ? 'bg-slate-50 border-slate-200 text-slate-400 line-through' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`;
                el.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer flex-grow pr-2">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleGrocery(${index})" class="rounded text-amber-500 focus:ring-amber-400 w-4 h-4">
                        <span>${item.text}</span>
                    </label>
                    <button onclick="deleteGrocery(${index})" class="text-slate-300 hover:text-rose-500 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function toggleGrocery(index) {
            groceries[index].checked = !groceries[index].checked;
            saveToStorage();
            renderGroceries();
        }

        function deleteGrocery(index) {
            groceries.splice(index, 1);
            saveToStorage();
            renderGroceries();
        }

        function addGroceryItem() {
            const text = prompt("Ajouter un article à la liste de courses :");
            if (text && text.trim() !== '') {
                groceries.push({ text: text.trim(), checked: false });
                saveToStorage();
                renderGroceries();
            }
        }

        function openModal(defaultDay = 'Lundi') {
            document.getElementById('mealId').value = '';
            document.getElementById('mealForm').reset();
            document.getElementById('mealDay').value = defaultDay;
            document.getElementById('mealType').value = 'Dîner'; // default to dinner
            document.getElementById('modalTitle').innerText = 'Ajouter un repas';
            document.getElementById('mealModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('mealModal').classList.add('hidden');
        }

        function editMeal(id) {
            const meal = meals.find(m => m.id === id);
            if (!meal) return;

            document.getElementById('mealId').value = meal.id;
            document.getElementById('mealDay').value = meal.day;
            document.getElementById('mealType').value = meal.type;
            document.getElementById('mealName').value = meal.name;
            document.getElementById('mealNotes').value = meal.notes || '';
            document.getElementById('modalTitle').innerText = 'Modifier le repas';
            document.getElementById('mealModal').classList.remove('hidden');
        }

        function saveMeal(e) {
            e.preventDefault();
            const id = document.getElementById('mealId').value;
            const day = document.getElementById('mealDay').value;
            const type = document.getElementById('mealType').value;
            const name = document.getElementById('mealName').value;
            const notes = document.getElementById('mealNotes').value;

            if (id) {
                const index = meals.findIndex(m => m.id === parseInt(id));
                if (index !== -1) {
                    meals[index] = { id: parseInt(id), day, type, name, notes };
                }
            } else {
                const newId = meals.length > 0 ? Math.max(...meals.map(m => m.id)) + 1 : 1;
                meals.push({ id: newId, day, type, name, notes });
            }

            saveToStorage();
            renderGrid();
            closeModal();
        }

        function deleteMeal(id) {
            if (confirm("Voulez-vous supprimer ce repas ?")) {
                meals = meals.filter(m => m.id !== id);
                saveToStorage();
                renderGrid();
            }
        }

        function resetMenu() {
            if (confirm("Réinitialiser le menu avec les repas par défaut ?")) {
                meals = [...defaultMeals];
                saveToStorage();
                renderGrid();
            }
        }

        // Initialize on load
        renderGrid();
    </script>
</body>
</html>
