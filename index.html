<!DOCTYPE html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Rapport Maintenance Pro</title><link rel='stylesheet' href='css/style.css'><script src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js'></script></head><body><div class='container'><h1>RAPPORT DE FIN DE QUART – MAINTENANCE</h1><div class='grid'><input type='date' id='date'><select id='horaire'><option>Jour</option><option>Soir</option><option>Nuit</option></select></div><label>Nom</label><input id='nom'><button onclick="startVoice('nom')">🎤 Nom</button><label>Appels de service complétés</label><textarea id='services'></textarea><button onclick="startVoice('services')">🎤 Dictée</button><label>Interventions</label><textarea id='interventions'></textarea><button onclick="startVoice('interventions')">🎤 Dictée</button><label>Observations</label><textarea id='observations'></textarea><button onclick="startVoice('observations')">🎤 Dictée</button><h3>Signature</h3><canvas id='sig' width='500' height='150'></canvas><div><button onclick='clearForm()'>Effacer</button><button onclick='exportExcel()'>Exporter XLSX</button><button onclick='saveLocal()'>Sauvegarde locale</button></div></div><script src='js/app.js'></script></body></html>
