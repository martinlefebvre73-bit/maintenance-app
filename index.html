<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rapport de fin de quart - Maintenance</title>

https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#2F75B5;
    margin-bottom:25px;
}

.top-table{
    width:100%;
    margin-bottom:20px;
}

.top-table td{
    padding:10px;
}

input[type=text],
input[type=date],
select{
    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

.section-box{
    border:2px solid #2F75B5;
    border-radius:6px;
    margin-bottom:20px;
    overflow:hidden;
    background:white;
}

.section-title{
    background:#2F75B5;
    color:white;
    font-weight:bold;
    text-transform:uppercase;
    padding:12px;
}

.section-content{
    padding:12px;
    background:#F8FBFF;
}

textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    padding:10px;
    font-size:14px;
    box-sizing:border-box;
}

.voice-btn{
    background:#2F75B5;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-top:10px;
}

.voice-btn:hover{
    background:#1f5d94;
}

.checkbox-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:10px;
}

.signature-container{
    border:2px solid #2F75B5;
    border-radius:6px;
    overflow:hidden;
    background:white;
    margin-top:20px;
}

.signature-title{
    background:#2F75B5;
    color:white;
    font-weight:bold;
    padding:12px;
}

.signature-box{
    width:100%;
    height:220px;
    background:#fff;
    display:block;
    touch-action:none;
    cursor:crosshair;
}

.actions{
    margin-top:25px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.actions button{
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.btn-save{
    background:#28a745;
}

.btn-clear{
    background:#dc3545;
}

.btn-sign{
    background:#f39c12;
}

</style>

</head>

<body>

<h1>RAPPORT DE FIN DE QUART - MAINTENANCE</h1>

<table class="top-table">

<tr>

<td>

<label>Date</label>
<input type="date" id="date">

</td>

<td>

<label>Horaire</label>

<select id="horaire">
<option>Jour</option>
<option>Soir</option>
<option>Nuit</option>
<option>07h00 - 15h00</option>
<option>15h00 - 23h00</option>
<option>23h00 - 07h00</option>
</select>

</td>

</tr>

<tr>

<td colspan="2">

<label>Nom</label>

<div style="display:flex;gap:10px;align-items:center;">

<input type="text" id="nom">

<button
type="button"
class="voice-btn"
onclick="startDictation('nom')">
🎤
</button>

</div>

</td>

</tr>

</table>

<div class="section-box">

<div class="section-title">
Sujets traités
</div>

<div class="section-content">

<div class="checkbox-grid">

<label><input type="checkbox"> Appels de service complétés</label>
<label><input type="checkbox"> Inspection générale</label>
<label><input type="checkbox"> Intervention d'urgence</label>
<label><input type="checkbox"> Suivi travaux en cours</label>
<label><input type="checkbox"> Vérification équipements mécaniques</label>
<label><input type="checkbox"> Vérification systèmes électriques</label>
<label><input type="checkbox"> Nettoyage / entretien installations</label>
<label><input type="checkbox"> Autre</label>

</div>

</div>

</div>

<div id="sections"></div>

<div class="signature-container">

<div class="signature-title">
Signature
</div>

<canvas
id="signature"
class="signature-box">
</canvas>

</div>

<div class="actions">

<button
class="btn-sign"
onclick="clearSignature()">
Effacer Signature
</button>

<button
class="btn-clear"
onclick="clearForm()">
Effacer Formulaire
</button>

<button
class="btn-save"
onclick="saveExcel()">
Sauvegarder Excel
</button>

</div>

<script>

document.getElementById("date").value =
new Date().toISOString().substring(0,10);

const sections = [

["serviceCompletes","Appels de service complétés"],
["interventions","Appels de service / Interventions"],
["piscine","Particularités / Piscine"],
["urgence","Intervention d'urgence"],
["travaux","Suivi travaux en cours"],
["observations","Autres observations"],
["details","Détails et Variants"]

];

const container =
document.getElementById("sections");

sections.forEach(section=>{

container.innerHTML += `

<div class="section-box">

<div class="section-title">
${section[1]}
</div>

<div class="section-content">

<textarea id="${section[0]}"></textarea>

<button
type="button"
class="voice-btn"
onclick="startDictation('${section[0]}')">

🎤 Dictée vocale

</button>

</div>

</div>

`;

});

function startDictation(id){

if(!('webkitSpeechRecognition' in window)){
alert("Dictée vocale non disponible");
return;
}

const recognition =
new webkitSpeechRecognition();

recognition.lang = "fr-CA";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onresult = function(event){

let texte =
event.results[0][0].transcript;

const champ =
document.getElementById(id);

if(champ.tagName === "TEXTAREA"){
champ.value += texte + "\n";
}
else{
champ.value = texte;
}

};

recognition.start();

}

const canvas =
document.getElementById("signature");

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

const ratio =
window.devicePixelRatio || 1;

canvas.width =
canvas.offsetWidth * ratio;

canvas.height =
canvas.offsetHeight * ratio;

ctx.setTransform(ratio,0,0,ratio,0,0);

ctx.lineWidth = 2;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = "#000";

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);

let dessin = false;

function getPoint(event){

const rect =
canvas.getBoundingClientRect();

if(event.touches &&
event.touches.length > 0){

return{

x:event.touches[0].clientX - rect.left,
y:event.touches[0].clientY - rect.top

};

}

return{

x:event.clientX - rect.left,
y:event.clientY - rect.top

};

}

function debutSignature(event){

event.preventDefault();

dessin = true;

const point =
getPoint(event);

ctx.beginPath();
ctx.moveTo(point.x,point.y);

}

function signer(event){

if(!dessin) return;

event.preventDefault();

const point =
getPoint(event);

ctx.lineTo(point.x,point.y);
ctx.stroke();

}

function finSignature(event){

event.preventDefault();

dessin = false;

ctx.beginPath();

}

canvas.addEventListener(
"mousedown",
debutSignature
);

canvas.addEventListener(
"mousemove",
signer
);

canvas.addEventListener(
"mouseup",
finSignature
);

canvas.addEventListener(
"mouseleave",
finSignature
);

canvas.addEventListener(
"touchstart",
debutSignature,
{passive:false}
);

canvas.addEventListener(
"touchmove",
signer,
{passive:false}
);

canvas.addEventListener(
"touchend",
finSignature,
{passive:false}
);

canvas.addEventListener(
"touchcancel",
finSignature,
{passive:false}
);

function clearSignature(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

function signatureExiste(){

const blank =
document.createElement("canvas");

blank.width = canvas.width;
blank.height = canvas.height;

return (
canvas.toDataURL() !==
blank.toDataURL()
);

}

function clearForm(){

document
.querySelectorAll("textarea")
.forEach(el=>el.value="");

document
.querySelectorAll("input[type=text]")
.forEach(el=>el.value="");

document
.querySelectorAll("input[type=checkbox]")
.forEach(el=>el.checked=false);

clearSignature();

}

function saveExcel(){

if(!signatureExiste()){

alert(
"Veuillez signer avant de sauvegarder."
);

return;

}

const signaturePNG =
canvas.toDataURL("image/png");

let data = [

["Date",document.getElementById("date").value],
["Horaire",document.getElementById("horaire").value],
["Nom",document.getElementById("nom").value],

["Appels complétés",
document.getElementById("serviceCompletes").value],

["Interventions",
document.getElementById("interventions").value],

["Piscine",
document.getElementById("piscine").value],

["Urgence",
document.getElementById("urgence").value],

["Travaux",
document.getElementById("travaux").value],

["Observations",
document.getElementById("observations").value],

["Détails",
document.getElementById("details").value],

["Signature",
signaturePNG]

];

const wb =
XLSX.utils.book_new();

const ws =
XLSX.utils.aoa_to_sheet(data);

XLSX.utils.book_append_sheet(
wb,
ws,
"Rapport"
);

const fileName =
"Rapport_Maintenance_" +
document.getElementById("date").value +
".xlsx";

XLSX.writeFile(
wb,
fileName
);

alert(
"Rapport sauvegardé avec succès."
);

}

</script>

</body>
</html>
