<style>

body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#2F75B5;
    margin-bottom:25px;
}

.top-table{
    width:100%;
    margin-bottom:20px;
}

.top-table td{
    padding:10px;
}

input[type=text],
input[type=date],
select{
    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

.section-box{
    border:2px solid #2F75B5;
    border-radius:6px;
    margin-bottom:20px;
    overflow:hidden;
    background:white;
}

.section-title{
    background:#2F75B5;
    color:white;
    font-weight:bold;
    text-transform:uppercase;
    padding:12px;
}

.section-content{
    padding:12px;
    background:#F8FBFF;
}

textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    padding:10px;
    font-size:14px;
    box-sizing:border-box;
}

.voice-btn{
    background:#2F75B5;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-top:10px;
}

.voice-btn:hover{
    background:#1f5d94;
}

.checkbox-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:10px;
}

.signature-container{
    border:2px solid #2F75B5;
    border-radius:6px;
    overflow:hidden;
    background:white;
    margin-top:20px;
}

.signature-title{
    background:#2F75B5;
    color:white;
    font-weight:bold;
    padding:12px;
}

.signature-box{
    width:100%;
    height:220px;
    background:#fff;
    display:block;
    touch-action:none;
    cursor:crosshair;
}

.actions{
    margin-top:25px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.actions button{
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.btn-save{
    background:#28a745;
}

.btn-clear{
    background:#dc3545;
}

.btn-sign{
    background:#f39c12;
}

</style>
